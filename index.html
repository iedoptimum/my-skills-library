<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Claude Skills</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f7;
    --card-bg: #ffffff;
    --text: #1a1a1e;
    --muted: #5b5b63;
    --accent: #6b4fbb;
    --accent-bg: #efe9fb;
    --border: #e3e3e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card-bg: #1f1f24;
      --text: #ececef;
      --muted: #a3a3ad;
      --accent: #b8a6ec;
      --accent-bg: #2a2338;
      --border: #2d2d34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    max-width: 960px;
    margin: 0 auto;
    padding: 3rem 1.5rem 1rem;
  }
  h1 {
    font-size: 1.9rem;
    margin: 0 0 0.4rem;
  }
  .subtitle {
    color: var(--muted);
    margin: 0;
    font-size: 0.95rem;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 1rem 1.5rem 4rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
  }
  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 0.5rem;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    color: var(--accent);
  }
  .card p {
    margin: 0 0 0.9rem;
    color: var(--text);
    font-size: 0.92rem;
  }
  .sub-skills {
    list-style: none;
    margin: 0;
    padding: 0.8rem 0 0;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  .sub-skills li {
    font-size: 0.85rem;
  }
  .sub-skills .sub-name {
    display: inline-block;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 6px;
    padding: 0.05rem 0.5rem;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.8rem;
    margin-right: 0.4rem;
  }
  .sub-skills .sub-desc {
    color: var(--muted);
  }
  .empty, .error {
    color: var(--muted);
    padding: 2rem 0;
  }
  footer {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<header>
  <h1>My Claude Skills</h1>
  <p class="subtitle" id="updated">Loading…</p>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="status"></div>
</main>
<footer>Source data lives in <code>skills.json</code> in this repo.</footer>

<script>
  fetch('./skills.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(renderSkills)
    .catch(function (err) {
      document.getElementById('status').innerHTML =
        '<p class="error">Could not load skills.json (' + err.message + ').</p>';
      document.getElementById('updated').textContent = '';
    });

  function renderSkills(data) {
    var skills = data.personal_skills || [];
    var updatedEl = document.getElementById('updated');
    updatedEl.textContent = skills.length +
      (skills.length === 1 ? ' skill' : ' skills') +
      (data.updated ? ' — last updated ' + data.updated : '');

    var grid = document.getElementById('grid');
    if (!skills.length) {
      document.getElementById('status').innerHTML = '<p class="empty">No skills yet.</p>';
      return;
    }

    skills.forEach(function (skill) {
      var card = document.createElement('div');
      card.className = 'card';

      var h2 = document.createElement('h2');
      h2.textContent = skill.name;
      card.appendChild(h2);

      var p = document.createElement('p');
      p.textContent = skill.description || '';
      card.appendChild(p);

      if (skill.sub_skills && skill.sub_skills.length) {
        var ul = document.createElement('ul');
        ul.className = 'sub-skills';
        skill.sub_skills.forEach(function (sub) {
          var li = document.createElement('li');

          var nameSpan = document.createElement('span');
          nameSpan.className = 'sub-name';
          nameSpan.textContent = sub.name;
          li.appendChild(nameSpan);

          var descSpan = document.createElement('span');
          descSpan.className = 'sub-desc';
          descSpan.textContent = sub.description || '';
          li.appendChild(descSpan);

          ul.appendChild(li);
        });
        card.appendChild(ul);
      }

      grid.appendChild(card);
    });
  }
</script>
</body>
</html>

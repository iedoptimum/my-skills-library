<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill Library</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #181a1b;
    --paper: #f2f4f0;
    --surface: #ffffff;
    --surface-2: #fafbf8;
    --line: #e3e6e0;
    --line-soft: #eef0ec;
    --muted: #6e766f;
    --muted-2: #9aa39b;

    --pine: #1f6e5b;
    --pine-soft: #e7f1ed;
    --amber: #8a6a1f;
    --amber-soft: #f4eddb;

    --radius: 14px;
    --shadow: 0 1px 2px rgba(24,26,27,.04), 0 8px 24px -14px rgba(24,26,27,.18);
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eceeec;
      --paper: #16181a;
      --surface: #1e2123;
      --surface-2: #24282a;
      --line: #313634;
      --line-soft: #292d2b;
      --muted: #a0a9a2;
      --muted-2: #6e766f;

      --pine: #5cc9a8;
      --pine-soft: #1c332c;
      --amber: #e0bb6a;
      --amber-soft: #362d18;
      --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -14px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background:
      radial-gradient(120% 60% at 100% 0%, color-mix(in srgb, var(--pine-soft) 55%, transparent) 0%, transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 40px 24px 80px; }

  header { margin-bottom: 30px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--pine);
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 14px;
  }
  .eyebrow .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--pine);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(31,110,91,.45); }
    70%  { box-shadow: 0 0 0 7px rgba(31,110,91,0); }
    100% { box-shadow: 0 0 0 0 rgba(31,110,91,0); }
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(30px, 5.5vw, 46px);
    letter-spacing: -.02em;
    margin: 0 0 10px;
    line-height: 1.04;
  }
  .lede {
    font-size: 15.5px;
    color: var(--muted);
    max-width: 56ch;
    margin: 0;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
    margin-top: 22px;
  }
  .stat {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 13px;
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
  }
  .stat b { color: var(--ink); font-weight: 600; font-size: 13px; }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 26px 0 22px;
    padding: 12px 0;
    background: linear-gradient(var(--paper) 72%, transparent);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search { flex: 1 1 240px; position: relative; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted-2); }
  .search input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14.5px;
    color: var(--ink);
    padding: 12px 14px 12px 40px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--muted-2); }
  .search input:focus { border-color: var(--pine); box-shadow: 0 0 0 3px var(--pine-soft); }

  .btn {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .03em;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 12px 15px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--muted-2); }
  .btn:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }

  .group-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin: 26px 2px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .group-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--pine);
  }

  .card-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 18px 20px 18px 22px;
    cursor: pointer;
    user-select: none;
  }
  .card-head:focus-visible { outline: 2px solid var(--pine); outline-offset: -3px; border-radius: var(--radius); }

  .glyph {
    width: 42px; height: 42px;
    border-radius: 11px;
    display: grid; place-items: center;
    font-size: 20px;
    background: var(--pine-soft);
  }

  .head-text { min-width: 0; }
  .id {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .08em;
    color: var(--muted-2);
    text-transform: uppercase;
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 3px;
  }
  .id .live { width: 6px; height: 6px; border-radius: 50%; background: var(--pine); }
  .name {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -.005em;
    color: var(--pine);
    margin: 0 0 4px;
    word-break: break-word;
    user-select: text;
    -webkit-user-select: text;
  }
  .sid { user-select: text; -webkit-user-select: text; }
  .desc { font-size: 14px; color: var(--muted); margin: 0; }

  .count {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    display: flex; align-items: center; gap: 9px;
    white-space: nowrap;
  }
  .chev { transition: transform .22s ease; color: var(--muted-2); flex: none; }
  .card.open .chev { transform: rotate(90deg); }

  .subs {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .26s ease;
  }
  .card.open .subs { grid-template-rows: 1fr; }
  .subs-inner { overflow: hidden; }
  .subs-grid {
    padding: 4px 20px 20px 22px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 9px;
    border-top: 1px solid var(--line-soft);
    margin-top: 2px;
    padding-top: 16px;
  }
  .sub {
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 11px 13px;
  }
  .sub-name {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .sub-desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .no-subs {
    padding: 4px 22px 20px;
    font-size: 12.5px;
    color: var(--muted-2);
    font-style: italic;
    border-top: 1px solid var(--line-soft);
    margin-top: 2px;
    padding-top: 14px;
  }

  mark { background: #fdf0c8; color: #181a1b; border-radius: 3px; padding: 0 1px; }

  .empty, .error {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
    font-size: 14.5px;
  }

  footer {
    margin-top: 34px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--muted-2);
    line-height: 1.6;
  }
  footer code {
    font-family: var(--font-mono);
    font-size: 11.5px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 6px;
    color: var(--ink);
  }

  @media (max-width: 560px) {
    .card-head { grid-template-columns: auto 1fr; }
    .count { grid-column: 1 / -1; justify-content: flex-start; margin-top: 2px; }
    .glyph { width: 38px; height: 38px; font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot"></span> Personal skill registry</div>
    <h1>Skill Library</h1>
    <p class="lede">My specialized Claude skills — what each one does and the sub-skills packed inside it. Search to jump straight to anything.</p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search skills and sub-skills…" autocomplete="off" aria-label="Search skills" />
    </div>
    <button class="btn" id="toggleAll" aria-label="Expand or collapse all skills">Expand all</button>
  </div>

  <main id="list"></main>

  <footer>
    Showing personal skills only.
    To update, edit <code>skills.json</code> in this repo, commit, and push — the page reloads it on every visit.
    <span id="stamp"></span>
  </footer>
</div>

<script>
fetch('./skills.json', { cache: 'no-store' })
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch(function (err) {
    document.getElementById('list').innerHTML =
      '<div class="error">Could not load skills.json (' + err.message + ').</div>';
  });

function render(data) {
  var skills = data.skills || [];
  var list = document.getElementById('list');

  var totalSubs = skills.reduce(function (n, s) { return n + (s.sub_skills ? s.sub_skills.length : 0); }, 0);
  document.getElementById('meta').innerHTML =
    '<span class="stat"><b>' + skills.length + '</b> skills</span>' +
    '<span class="stat"><b>' + totalSubs + '</b> sub-skills</span>';
  document.getElementById('stamp').textContent = data.updated ? (' Snapshot: ' + data.updated + '.') : '';

  if (!skills.length) {
    list.innerHTML = '<div class="empty">No skills yet.</div>';
    return;
  }

  var groupLabel = document.createElement('div');
  groupLabel.className = 'group-label';
  groupLabel.textContent = 'Personal skills';
  list.appendChild(groupLabel);

  skills.forEach(function (s, i) {
    var num = String(i + 1).padStart(2, '0');
    var subs = s.sub_skills || [];

    var card = document.createElement('section');
    card.className = 'card';

    var subsHTML;
    if (subs.length) {
      subsHTML = '<div class="subs"><div class="subs-inner"><div class="subs-grid">' +
        subs.map(function (sub) {
          return '<div class="sub">' +
            '<div class="sub-name">' + escapeHTML(sub.name) + '</div>' +
            '<div class="sub-desc">' + escapeHTML(sub.description || '') + '</div>' +
            '</div>';
        }).join('') +
        '</div></div></div>';
    } else {
      subsHTML = '<div class="subs"><div class="subs-inner"><div class="no-subs">A single, self-contained skill — no sub-skills.</div></div></div>';
    }

    var countLabel = subs.length ? (subs.length + ' sub-skill' + (subs.length === 1 ? '' : 's')) : 'core skill';
    var title = s.title || s.id;
    var id = s.id || (s.name || '').replace(/^\//, '');

    card.innerHTML =
      '<div class="card-head" role="button" tabindex="0" aria-expanded="false">' +
        '<div class="glyph">' + (s.glyph || '✨') + '</div>' +
        '<div class="head-text">' +
          '<div class="id"><span class="live"></span>SK-' + num + ' · <span class="sid">' + escapeHTML(title) + '</span></div>' +
          '<h2 class="name">/' + escapeHTML(id) + '</h2>' +
          '<p class="desc">' + escapeHTML(s.description || '') + '</p>' +
        '</div>' +
        '<div class="count">' + countLabel +
          '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>' +
        '</div>' +
      '</div>' + subsHTML;

    card._data = (id + ' ' + title + ' ' + (s.description || '') + ' ' +
      subs.map(function (x) { return x.name + ' ' + x.description; }).join(' ')).toLowerCase();

    list.appendChild(card);

    var head = card.querySelector('.card-head');
    var toggle = function () {
      var open = card.classList.toggle('open');
      head.setAttribute('aria-expanded', open);
    };
    head.addEventListener('click', toggle);
    head.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });

  setupToolbar(list, groupLabel);
}

function escapeHTML(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function setupToolbar(list, groupLabel) {
  var toggleAllBtn = document.getElementById('toggleAll');
  toggleAllBtn.addEventListener('click', function () {
    var cards = Array.prototype.filter.call(document.querySelectorAll('.card'), function (c) { return c.style.display !== 'none'; });
    var anyClosed = cards.some(function (c) { return !c.classList.contains('open'); });
    cards.forEach(function (c) {
      c.classList.toggle('open', anyClosed);
      c.querySelector('.card-head').setAttribute('aria-expanded', anyClosed);
    });
    toggleAllBtn.textContent = anyClosed ? 'Collapse all' : 'Expand all';
  });

  var search = document.getElementById('search');

  function clearMarks(root) {
    root.querySelectorAll('mark').forEach(function (m) { m.replaceWith(document.createTextNode(m.textContent)); });
  }
  function highlight(el, q) {
    el.querySelectorAll('.name, .desc, .sub-name, .sub-desc, .sid').forEach(function (node) {
      clearMarks(node);
      if (!q) return;
      var t = node.textContent;
      var i = t.toLowerCase().indexOf(q);
      if (i < 0) return;
      var frag = document.createDocumentFragment();
      frag.append(t.slice(0, i));
      var m = document.createElement('mark'); m.textContent = t.slice(i, i + q.length);
      frag.append(m, t.slice(i + q.length));
      node.textContent = ''; node.append(frag);
    });
  }

  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();
    var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
    var visible = 0;

    cards.forEach(function (card) {
      var match = !q || card._data.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) visible++;
      highlight(card, q);
      if (q && match) { card.classList.add('open'); card.querySelector('.card-head').setAttribute('aria-expanded', true); }
      if (!q) { card.classList.remove('open'); card.querySelector('.card-head').setAttribute('aria-expanded', false); }
    });

    groupLabel.style.display = visible ? '' : 'none';

    var empty = document.getElementById('empty');
    if (!visible) {
      if (!empty) {
        empty = document.createElement('div');
        empty.id = 'empty'; empty.className = 'empty';
        list.appendChild(empty);
      }
      empty.textContent = 'No skills match “' + search.value.trim() + '”.';
    } else if (empty) empty.remove();

    toggleAllBtn.textContent = q ? 'Collapse all' : 'Expand all';
  });
}
</script>
</body>
</html>
